name: Repro

on:
  push:
  workflow_dispatch:

jobs:
  docs:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install
      - run: npx typedoc
      - name: Generated files
        shell: bash
        run: find docs -type f | sort
      - name: Generated links
        shell: bash
        run: grep -rn "](" docs || true
      - name: Links must not contain a backslash
        shell: bash
        run: |
          test -f docs/ui/namespaces/helpers.md
          if grep -rn '](.*\\' docs; then
            echo "::error::a generated link contains a backslash"
            exit 1
          fi
